        </div>
      </div>

      <p class="caption">Dark or light, used or remaining — your call.</p>
    </div>

    <script>
      (() => {
        const stage = document.getElementById("themes");
        document.fonts.load('500 12px "Space Grotesk Variable"').then(() => {
          const dark = stage.querySelector("#themes-dark");
          const light = dark.cloneNode(true);
          light.id = "themes-light";
          light.classList.add("theme-light");
          dark.after(light);
          // The twins overlap on purpose while the edge sweeps; each one is hidden while the other holds.
          for (const el of light.querySelectorAll("*")) el.dataset.layoutAllowOverlap = "";

          // A diagonal edge (top leads by S) sweeps left to right; the light twin shows between a and b.
          const { width, height } = getComputedStyle(dark); // pre-zoom px, as clip-path uses them
          const [W, H] = [parseFloat(width), parseFloat(height)];
          const S = 160;
          const M = 90; // margin that keeps the window's shadow inside the clip
          const band = (a, b) =>
            `polygon(${a}px ${-M}px, ${b}px ${-M}px, ${b - S}px ${H + M}px, ${a - S}px ${H + M}px)`;
          const off = -M;
          const past = W + M + S;

          const tl = gsap.timeline({ paused: true });
          tl.set(light, { autoAlpha: 0, clipPath: band(off, off) }, 0);

          // Dark -> light -> dark. The covered twin is hidden while the other one holds.
          tl.set(light, { autoAlpha: 1 }, 0.7);
          tl.to(light, { clipPath: band(off, past), duration: 0.75, ease: "power2.inOut" }, 0.7);
          tl.set(dark, { autoAlpha: 0 }, 1.45);
          tl.set(dark, { autoAlpha: 1 }, 2.45);
          tl.to(light, { clipPath: band(past, past), duration: 0.75, ease: "power2.inOut" }, 2.45);
          tl.set(light, { autoAlpha: 0 }, 3.2);

          // Used -> remaining and back: the numbers roll, the bars stay (they always show usage).
          const cells = dark.querySelectorAll(".roll");
          TV.roll(tl, cells, 3.7, false, 0.012);
          TV.roll(tl, cells, 5.4, true, 0.012);

          window.__timelines["themes"] = tl;
        });
      })();
    </script>
