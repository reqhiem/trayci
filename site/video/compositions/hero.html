<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <title>Trayci hero</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/video.css" />
    <script src="assets/video.js"></script>
    <style>
      #hero .panel {
        position: absolute;
        inset: 0 0 auto;
        height: 42px;
        background: rgba(9, 12, 16, 0.92);
        box-shadow: 0 1px 0 rgba(246, 244, 239, 0.08);
      }
      #hero .workspaces {
        position: absolute;
        left: 24px;
        top: 17px;
        display: flex;
        gap: 6px;
      }
      #hero .workspaces i {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: rgba(246, 244, 239, 0.32);
      }
      #hero .workspaces i:first-child {
        width: 22px;
        background: rgba(246, 244, 239, 0.86);
      }
      /* The Trayci icon is centred on x = 680: the popover's master column hangs centred under it. */
      #hero .tray {
        position: absolute;
        left: 667px;
        top: 0;
        height: 42px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: rgba(246, 244, 239, 0.86);
      }
      #hero .tray img {
        width: 26px;
        height: 26px;
      }
      #hero .tray svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #hero .clock {
        margin-left: 6px;
        font-size: 17px;
        font-weight: 500;
        color: #f6f4ef;
      }
      #hero-pill {
        position: absolute;
        left: 660px;
        top: 6px;
        width: 40px;
        height: 30px;
        border-radius: 15px;
        background: rgba(246, 244, 239, 0.13);
        visibility: hidden;
        opacity: 0;
      }
      #hero-pop {
        left: 410px;
        top: 42px;
        transform-origin: 270px 0;
      }
      #hero .caption {
        left: 410px;
        top: 806px;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <div
      id="hero"
      class="stage"
      data-composition-id="hero"
      data-start="0"
      data-duration="8.8"
      data-width="1600"
      data-height="1000"

      <div class="panel">
        <span class="workspaces"><i></i><i></i><i></i></span>
      </div>
      <span id="hero-pill"></span>
      <div class="tray">
        <img id="hero-icon" src="assets/trayci.svg" alt="" />
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0" />
          <circle cx="12" cy="19.2" r="1.3" fill="currentColor" stroke="none" />
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" />
          <path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.5a8 8 0 0 1 0 11" />
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="7" width="17" height="10" rx="2.5" />
          <path d="M21.5 10.5v3" />
          <rect x="4.8" y="9.3" width="10" height="5.4" rx="1.2" fill="currentColor" stroke="none" />
        </svg>
        <span class="clock">14:32</span>
      </div>

      <div class="pop" id="hero-pop">
        <div class="zoom" style="zoom: 1.5">
          <div class="window" id="hero-window"><main class="has-detail" data-layout-allow-overflow><section class="master"><header class="topbar" data-tauri-drag-region="deep"><h1>Usage</h1><div class="header-actions"><span>all agents</span><button class="icon-button" type="button" aria-label="Refresh usage"><span class="" aria-hidden="true">↻</span></button><button class="icon-button settings-button" type="button" aria-label="Settings">···</button></div></header><div class="density" aria-label="Information density"><button type="button" aria-pressed="true">Detailed</button><button type="button" aria-pressed="false">Compact</button></div><div class="provider-list" aria-live="polite"><button class="provider-row provider-ok" type="button" aria-busy="false" aria-expanded="false"><div class="provider-summary"><span class="provider-icon antigravity-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.8c.8 5.1 4.1 8.4 9.2 9.2-5.1.8-8.4 4.1-9.2 9.2-.8-5.1-4.1-8.4-9.2-9.2 5.1-.8 8.4-4.1 9.2-9.2Z"></path><path d="M18.2 3.2c.2 1.5 1.1 2.4 2.6 2.6-1.5.2-2.4 1.1-2.6 2.6-.2-1.5-1.1-2.4-2.6-2.6 1.5-.2 2.4-1.1 2.6-2.6Z"></path></svg></span><strong>Antigravity</strong><span class="reset-summary">Resets in 4<span class="roll"><span>7</span><span>6</span></span>m</span><span class="chevron" aria-hidden="true"></span><span class="compact-value compact-overlay">46m<strong>93%</strong></span></div><div class="inline-metrics inline-metrics-grid"><div class="metric metric-dense"><div class="metric-copy"><strong>Gem 5h</strong></div><div class="metric-line"><div class="progress progress-high" role="progressbar" aria-label="Gemini 5h usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="88"><span style="width: 88%;"></span></div><strong><span class="n">88</span>%</strong></div></div><div class="metric metric-dense"><div class="metric-copy"><strong>Gem wk</strong></div><div class="metric-line"><div class="progress progress-low" role="progressbar" aria-label="Gemini Weekly usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="36"><span style="width: 36%;"></span></div><strong><span class="n">36</span>%</strong></div></div><div class="metric metric-dense"><div class="metric-copy"><strong>C/G 5h</strong></div><div class="metric-line"><div class="progress progress-critical" role="progressbar" aria-label="Claude/GPT 5h usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="93"><span style="width: 93%;"></span></div><strong><span class="n">93</span>%</strong></div></div><div class="metric metric-dense"><div class="metric-copy"><strong>C/G wk</strong></div><div class="metric-line"><div class="progress progress-medium" role="progressbar" aria-label="Claude/GPT Weekly usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="51"><span style="width: 51%;"></span></div><strong><span class="n">51</span>%</strong></div></div></div></button><button class="provider-row provider-ok" type="button" aria-busy="false" aria-expanded="false"><div class="provider-summary"><span class="provider-icon claude-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4M8.4 3.8l7.2 16.4M20.2 8.4 3.8 15.6M15.6 3.8 8.4 20.2M20.2 15.6 3.8 8.4"></path></svg></span><strong>Claude</strong><span class="reset-summary">Resets in 3d 6h</span><span class="chevron" aria-hidden="true"></span><span class="compact-value compact-overlay">3d 6h<strong>68%</strong></span></div><div class="inline-metrics inline-metrics-grid"><div class="metric metric-dense"><div class="metric-copy"><strong>5h</strong></div><div class="metric-line"><div class="progress progress-low" role="progressbar" aria-label="5h usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><span style="width: 42%;"></span></div><strong><span class="n">42</span>%</strong></div></div><div class="metric metric-dense"><div class="metric-copy"><strong>wk</strong></div><div class="metric-line"><div class="progress progress-medium" role="progressbar" aria-label="Weekly usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68"><span style="width: 68%;"></span></div><strong><span class="n">68</span>%</strong></div></div><div class="metric metric-dense"><div class="metric-copy"><strong>Fable</strong></div><div class="metric-line"><div class="progress progress-low" role="progressbar" aria-label="Fable usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="31"><span style="width: 31%;"></span></div><strong><span class="n">31</span>%</strong></div></div></div></button><button class="provider-row provider-ok" type="button" aria-busy="false" aria-expanded="false"><div class="provider-summary"><span class="provider-icon codex-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.1a4.4 4.4 0 0 1 4 2.5 4.4 4.4 0 0 1 3.8 6.6 4.4 4.4 0 0 1-3.7 6.3 4.4 4.4 0 0 1-7.9-.1 4.4 4.4 0 0 1-3.9-6.3 4.4 4.4 0 0 1 3.8-6.5A4.4 4.4 0 0 1 12 3.1Z"></path><path d="m8.1 5.6 7.8 4.5v8.4M4.3 12.1l7.7-4.5 7.8 4.6M8.2 18.4V9.5l7.7-3.9M16.1 18.5 8.2 14l-3.9 2.2M12 20.9v-9l-7.7-4.4"></path></svg></span><strong>Codex</strong><span class="reset-summary">Resets in 5d 2h</span><span class="chevron" aria-hidden="true"></span><span class="compact-value compact-overlay">5d 2h<strong>57%</strong></span></div><div class="inline-metrics"><div class="metric metric-dense"><div class="metric-copy"><strong>5h</strong></div><div class="metric-line"><div class="progress progress-low" role="progressbar" aria-label="5h usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"><span style="width: 12%;"></span></div><strong><span class="n">12</span>%</strong></div></div><div class="metric metric-dense"><div class="metric-copy"><strong>wk</strong></div><div class="metric-line"><div class="progress progress-medium" role="progressbar" aria-label="Weekly usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="57"><span style="width: 57%;"></span></div><strong><span class="n">57</span>%</strong></div></div></div></button></div></section><aside class="provider-detail" aria-label="Claude details"><header data-tauri-drag-region="deep"><div class="detail-title"><span class="provider-icon claude-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4M8.4 3.8l7.2 16.4M20.2 8.4 3.8 15.6M15.6 3.8 8.4 20.2M20.2 15.6 3.8 8.4"></path></svg></span><strong>Claude</strong></div><span>Updated just now · via API</span></header><div class="detail-metrics"><div class="metric"><div class="metric-copy"><strong>5h</strong></div><div class="metric-line"><div class="progress progress-low" role="progressbar" aria-label="5h usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><span style="width: 42%;"></span></div><strong>42%</strong></div><div class="metric-meta"><span>42% used</span><span>Resets in 2h 1<span class="roll"><span>4</span><span>3</span></span>m</span></div></div><div class="metric"><div class="metric-copy"><strong>Weekly</strong></div><div class="metric-line"><div class="progress progress-medium" role="progressbar" aria-label="Weekly usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68"><span style="width: 68%;"></span></div><strong>68%</strong></div><div class="metric-meta"><span>68% used</span><span>Resets in 3d 6h</span></div></div><div class="metric"><div class="metric-copy"><strong>Fable</strong></div><div class="metric-line"><div class="progress progress-low" role="progressbar" aria-label="Fable usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="31"><span style="width: 31%;"></span></div><strong>31%</strong></div><div class="metric-meta"><span>31% used</span><span>Resets in 3d 6h</span></div></div></div></aside></main></div>
        </div>
      </div>

      <p class="caption">Every AI quota and reset, one click from your tray.</p>
      <div class="ring" id="hero-ring"></div>
      <svg class="cursor" id="hero-cursor" viewBox="0 0 16 24" aria-hidden="true">
        <path
          d="M1 1v19.2l4.6-4.4 3.1 7.2 3.1-1.3-3.1-7.1h6.4z"
          fill="#f6f4ef"
          stroke="#0b0f14"
          stroke-width="1.3"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <script>
      (() => {
        const stage = document.getElementById("hero");
        const $ = (s) => stage.querySelector(s);
        const $$ = (s) => [...stage.querySelectorAll(s)];
        gsap.registerPlugin(MotionPathPlugin);

        // Measure the laid-out UI once the font is in, then build and register the timeline.
        document.fonts.load('500 12px "Space Grotesk Variable"').then(() => {
          const cursor = $("#hero-cursor");
          const ring = $("#hero-ring");
          const pop = $("#hero-pop");
          const win = $("#hero-window");
          const pane = $(".provider-detail");
          const pill = $("#hero-pill");
          const metrics = $$(".inline-metrics");
          const claude = $$(".provider-row")[1];
          const [detailed, compact] = $$(".density button");
          const at = (el, fx, fy) => TV.at(stage, el, fx, fy);
          const edge = at($(".master"), 1, 0).x; // master column's right edge
          const clear = "rgba(246, 244, 239, 0)";
          const tint = getComputedStyle(win).getPropertyValue("--tint").trim();

          const I = at($("#hero-icon"));
          const R = { x: I.x + 72, y: I.y + 100 }; // cursor at rest near the tray: loop start and end
          const C = at(claude, 0.82, 0.5);
          const W = { x: edge + 110, y: C.y - 12 }; // waiting just right of the popover
          const K = at(compact);

          const tl = gsap.timeline({ paused: true });
          tl.set(cursor, { x: R.x, y: R.y }, 0);
          tl.set([pop, pane], { autoAlpha: 0 }, 0);

          // Glide to the tray icon and click: the popover opens beneath it.
          TV.glide(tl, cursor, [R, I], 0.15, 0.5);
          tl.to(pill, { autoAlpha: 1, duration: 0.15 }, 0.55);
          TV.click(tl, cursor, ring, I, 0.75);
          tl.fromTo(
            pop,
            { autoAlpha: 0, y: -8, scale: 0.97 },
            { autoAlpha: 1, y: 0, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false },
            0.8,
          );

          // Meters fill from 0; each bar takes its band class the moment it crosses 50 / 85 / 90.
          const FILL = 1.3;
          $$(".provider-list .progress").forEach((bar, i) => {
            const t0 = 1.05 + i * 0.035;
            const used = +bar.getAttribute("aria-valuenow");
            tl.set(bar, { attr: { class: "progress progress-low" } }, 0);
            [
              [50, "medium"],
              [85, "high"],
              [90, "critical"],
            ]
              .filter(([v]) => used >= v)
              .forEach(([v, band]) => {
                const p = 1 - Math.sqrt(1 - v / used); // power2.out reaches v here
                tl.set(bar, { attr: { class: `progress progress-${band}` } }, t0 + p * FILL);
              });
            tl.fromTo(
              bar.firstElementChild,
              { width: "0%" },
              { width: `${used}%`, duration: FILL, ease: "power2.out" },
              t0,
            );
            tl.fromTo(
              bar.nextElementSibling.querySelector(".n"),
              { innerText: 0 },
              { innerText: used, snap: { innerText: 1 }, duration: FILL, ease: "power2.out" },
              t0,
            );
          });

          // Step aside (over the header, never across a row), then hover Claude: the pane opens.
          TV.glide(tl, cursor, [I, { x: edge + 40, y: 92 }, W], 0.92, 0.8, "power2.out");
          TV.glide(tl, cursor, [W, C], 2.55, 0.7);
          tl.fromTo(
            claude,
            { backgroundColor: clear },
            { backgroundColor: tint, duration: 0.12, ease: "none", immediateRender: false },
            2.91,
          );
          tl.to(win, { width: 680, duration: 0.32, ease: "power2.out" }, 2.91);
          tl.fromTo(
            pane,
            { autoAlpha: 0, x: -14 },
            { autoAlpha: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false },
            2.93,
          );

          // A minute passes: every countdown ticks (2h 14m -> 2h 13m, 47m -> 46m).
          TV.roll(tl, $$(".roll"), 4.2);

          // Through the pane to Compact (the hover stays Claude's), click: rows collapse.
          TV.glide(
            tl,
            cursor,
            [C, { x: edge + 70, y: C.y - 80 }, { x: edge + 45, y: K.y + 4 }, K],
            5.1,
            1.0,
          );
          tl.to(claude, { backgroundColor: clear, duration: 0.12, ease: "none" }, 5.32);
          TV.click(tl, cursor, ring, K, 6.15);
          tl.set(detailed, { attr: { "aria-pressed": "false" } }, 6.2);
          tl.set(compact, { attr: { "aria-pressed": "true" } }, 6.2);
          tl.to(metrics, { height: 0, paddingTop: 0, duration: 0.34, ease: "power2.inOut" }, 6.2);
          tl.to([...metrics, ...$$(".reset-summary")], { autoAlpha: 0, duration: 0.14, ease: "none" }, 6.2);
          tl.to($$(".compact-overlay"), { autoAlpha: 1, duration: 0.2, ease: "none" }, 6.32);

          // Back up to the tray: leaving the popover drops the hover, the pane closes; click hides it.
          TV.glide(tl, cursor, [K, I], 7.0, 0.6);
          tl.to(pane, { autoAlpha: 0, duration: 0.14, ease: "none" }, 7.41);
          tl.to(win, { width: 359, duration: 0.3, ease: "power2.inOut" }, 7.41);
          TV.click(tl, cursor, ring, I, 7.75);
          tl.to(pop, { autoAlpha: 0, y: -4, scale: 0.98, duration: 0.2, ease: "power2.in" }, 7.79);
          tl.to(pill, { autoAlpha: 0, duration: 0.15 }, 8.15);
          TV.glide(tl, cursor, [I, R], 8.05, 0.5);

          window.__timelines["hero"] = tl;
        });
      })();
    </script>
  </body>
</html>
