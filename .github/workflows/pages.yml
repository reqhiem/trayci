name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # release.yml publishes with GITHUB_TOKEN, which never fires `release` for other workflows.
  # Its completion does, and runs on main, which the github-pages environment accepts.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 22
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: deployment
        uses: actions/deploy-pages@v5
