name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    # The AppImage bundles the build host's libraries, so its glibc is the oldest one it runs on.
    # ubuntu-latest moved to 26.04 (glibc 2.43) and v0.5.0's AppImage stopped starting on 24.04 /
    # Mint 22. Pinned to the image v0.4.6 shipped from.
    # ponytail: 24.04 floor (glibc 2.39); an older pinned image widens it if 22.04 users ask.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "trayci") | .version')"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - run: make bundle-linux
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*

  build-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "trayci") | .version')"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      # The Makefile's bundle-win, without counting on make being on the Windows runner.
      - name: Bundle
        run: |
          cargo packager --release --formats nsis
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv "target/release/trayci_${version}_x64-setup.exe" "dist/Trayci_${version}_x64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-win
          path: dist/*

  release:
    needs: [build-linux, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: find release-assets -type f | xargs gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
