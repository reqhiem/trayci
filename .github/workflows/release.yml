name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: pnpm dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: node -e "if (process.env.GITHUB_REF_NAME.slice(1) !== require('./package.json').version) process.exit(1)"
      - run: pnpm dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: release-win
          path: |
            dist/*.exe

  release:
    needs: [build-linux, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.AppImage release-assets/*.deb release-assets/*.exe --generate-notes --verify-tag
