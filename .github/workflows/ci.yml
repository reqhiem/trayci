name: CI

on:
  # The landing builds and deploys in pages.yml; a site-only change needs none of these.
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  rust-linux:
    runs-on: ubuntu-24.04 # matches release.yml's build-linux
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # On a key miss a PR would save ~1 GB that only that PR can read; PRs restore main's instead.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Pinned: the bundle names the Makefile renames and the NSIS uninstall hook are this version's.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - run: make bundle-linux
      - uses: actions/upload-artifact@v7
        with:
          name: trayci-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 25 # cold ~13 min; a hung ConPTY test would otherwise burn 6 h
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      # The Makefile's bundle-win, without counting on make being on the Windows runner.
      - name: Bundle
        run: |
          cargo packager --release --formats nsis
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "trayci") | .version')"
          mkdir -p dist
          mv "target/release/trayci_${version}_x64-setup.exe" "dist/Trayci_${version}_x64-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: trayci-win-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
