[package]
name = "trayci-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"

# The terminal view (`trayci` in a terminal, #67) ships on Linux only for now.
[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }

[dev-dependencies]
tempfile = "3"
